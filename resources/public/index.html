<!DOCTYPE html>
<html>
  <head>
    <title>Euclid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040d14" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="images/fav.png" />
    <link rel="shortcut icon" type="image/x-icon" href="images/fav.png" />
    <style>
      html,
      body {
        width: 100%;
        min-height: 100vh;
        min-height: 100lvh;
        background: #040d14;
        color-scheme: dark;
        overflow-x: hidden;
        overscroll-behavior: none;
        padding: 0;
        margin: 0;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
      #sketch { position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100lvh; overflow: hidden; }
      #sketch canvas { display: block; }
    </style>
  </head>
  <body id="myapp">
    <div id="sketch"></div>
    <script src="main.js"></script>
  </body>
</html>
