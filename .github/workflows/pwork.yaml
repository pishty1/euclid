name: Deploy Euclid to pishty.uk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euclid-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pishty.uk/apps/euclid/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: euclid-maven-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn', 'package-lock.json') }}
      - name: Build and package static app
        run: |
          npm ci
          npx shadow-cljs release prod
          node scripts/package-release.mjs
          (cd dist && tar -czf ../release.tar.gz index.html images/fav.png release.json js/main-*.js)
      - name: Configure restricted deployment credentials
        env:
          DEPLOY_KEY: ${{ secrets.EUCLID_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.EUCLID_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/euclid
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy atomically
        run: |
          ssh -i ~/.ssh/euclid -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            euclid-deploy@pishty.uk "deploy $GITHUB_SHA" < release.tar.gz
      - name: Verify public release
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://pishty.uk/apps/euclid/release.json?verify=$GITHUB_SHA" > deployed.json
          node -e 'const d=require("./deployed.json"); if(d.commit!==process.env.GITHUB_SHA) process.exit(1)'
          curl --fail --silent --show-error --output /dev/null https://pishty.uk/apps/euclid/
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/euclid
